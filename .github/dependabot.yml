version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
    groups:
      nuget:
        patterns: ["*"]
    ignore:
      # Microsoft.Extensions.* follow the target framework (8.0.x for net8.0, 9.0.x for net9.0, 10.0.x for net10.0):
      # only patches, a new major comes with a new target framework.
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
